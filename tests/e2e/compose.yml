name: wpstudio-e2e
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpw-e2e
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: dbpw-e2e-secret
  wp:
    build: .
    depends_on: [db]
    ports: ["127.0.0.1:8089:80", "127.0.0.1:2289:22"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: dbpw-e2e-secret
      WORDPRESS_DB_NAME: wordpress
